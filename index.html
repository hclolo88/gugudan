<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>구구단 연습 & 게임 (사과 시각화)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-1:#a8edea; --bg-2:#fed6e3;
      --primary:#ff9a9e; --primary-hover:#ff6a88;
      --ok:#1a9c50; --ng:#d93025; --ink:#333;
      --card:#ffffff; --muted:#6b7280; --border:#e5e7eb;
    }
    body{
      font-family:'Jua', sans-serif;
      margin:0; background:linear-gradient(to bottom,var(--bg-1),var(--bg-2));
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .app{width:min(980px,100%); background:var(--card); border-radius:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.08); padding:24px;}
    h1{text-align:center; margin:0 0 8px; color:var(--ink);}
    .sub{text-align:center; color:var(--muted); margin:0 0 20px;}
    .tabs{display:flex; gap:12px; justify-content:center; margin-bottom:16px}
    .tabs button{border:none; border-radius:999px; padding:12px 22px; font-size:18px;
      background:var(--primary); color:#fff; cursor:pointer; transition:.2s;}
    .tabs button:hover{background:var(--primary-hover)}
    .panel{display:none}
    .panel.active{display:block}
    .card{background:#fff; border:2px solid #f1f5f9; border-radius:18px; padding:18px; margin-bottom:12px;}
    .q{font-size:46px; text-align:center; margin:16px 0}
    .inputs{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
    input[type="number"]{width:160px; font-size:22px; padding:10px; border-radius:12px; border:2px solid #e2e8f0;}
    .btn{border:none; border-radius:12px; padding:10px 16px; font-size:18px; cursor:pointer; background:#111827; color:#fff;}
    .btn.secondary{background:#475569}
    .result{text-align:center; font-size:20px; margin-top:10px; min-height:30px}
    .ok{color:var(--ok)} .ng{color:var(--ng)}
    .hint{margin-top:10px; background:#fff7ed; border:1px solid #fed7aa; color:#7c2d12;
      padding:10px 12px; border-radius:12px; text-align:left; font-size:18px; display:none}
    .hint strong{color:#b45309}
    .viz-grid{padding:12px; border:2px dashed #e2e8f0; border-radius:14px; background:#fafafa;}
    .viz-row{white-space:nowrap; line-height:1.8}
    .scorebar{display:flex; gap:12px; justify-content:center; margin-top:8px; flex-wrap:wrap; color:#0b5cab}
    .badge{background:#eef2ff; color:#3730a3; padding:6px 10px; border-radius:999px; border:1px solid #c7d2fe}
  </style>
</head>
<body>
  <div class="app">
    <h1>구구단 연습 & 게임</h1>
    <p class="sub">사과 그림으로 곱셈을 쉽게 이해해요!</p>

    <div class="tabs">
      <button id="tabPractice">연습 모드</button>
      <button id="tabGame">게임 모드</button>
    </div>

    <!-- 연습 모드 -->
    <div id="panelPractice" class="panel active">
      <div class="card">
        <div class="q" id="qPractice">문제를 시작해보세요</div>
        <div id="vizGrid" class="viz-grid"></div>
        <div class="inputs">
          <input type="number" id="ansPractice" placeholder="답 입력" />
          <button class="btn" id="btnCheckPractice">확인</button>
          <button class="btn secondary" id="btnNextPractice">다음 문제</button>
        </div>
        <div id="resPractice" class="result"></div>
        <div id="hintPractice" class="hint"></div>
        <button id="btnShowAnswer" class="btn secondary" style="display:none">정답 보기</button>
      </div>
    </div>

    <!-- 게임 모드 -->
    <div id="panelGame" class="panel">
      <div class="card">
        <div class="q" id="qGame">시작 버튼을 눌러요!</div>
        <div class="inputs">
          <input type="number" id="ansGame" placeholder="답 입력" />
          <button class="btn" id="btnCheckGame">확인</button>
          <button class="btn secondary" id="btnStartGame">다시 시작</button>
        </div>
        <div id="resGame" class="result"></div>
        <div class="scorebar">
          <span class="badge" id="scoreNow">점수: 0</span>
          <span class="badge" id="timeLeft">남은 시간: 30초</span>
          <span class="badge" id="bestScore">최고점: 0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let a=0,b=0; let score=0,tLeft=30,timer=null; 
    let best=parseInt(localStorage.getItem('gugu_best')||'0',10);

    // 탭 전환
    const panelPractice=document.getElementById('panelPractice');
    const panelGame=document.getElementById('panelGame');
    document.getElementById('tabPractice').onclick=()=>{panelPractice.classList.add('active');panelGame.classList.remove('active');};
    document.getElementById('tabGame').onclick=()=>{panelGame.classList.add('active');panelPractice.classList.remove('active');};

    // 연습 모드
    const qPractice=document.getElementById('qPractice');
    const ansPractice=document.getElementById('ansPractice');
    const resPractice=document.getElementById('resPractice');
    const hintPractice=document.getElementById('hintPractice');
    const btnCheckPractice=document.getElementById('btnCheckPractice');
    const btnNextPractice=document.getElementById('btnNextPractice');
    const btnShowAnswer=document.getElementById('btnShowAnswer');
    const vizGrid=document.getElementById('vizGrid');

    function rndInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
    function drawAppleGrid(){let html='';for(let i=0;i<b;i++){html+=`<div class="viz-row">${"🍎".repeat(a)}</div>`;}vizGrid.innerHTML=html;}
    function makePracticeQ(){a=rndInt(2,9);b=rndInt(1,9);qPractice.textContent=`${a} × ${b} = ?`;ansPractice.value='';resPractice.textContent='';hintPractice.style.display='none';btnShowAnswer.style.display='none';drawAppleGrid();}
    function makeHint(a,b){return `
      <strong>힌트:</strong><br>
      • ${a}를 ${b}번 더하면 얼마일까요?<br>
      • 순서를 바꿔도 같아요: ${a}×${b} = ${b}×${a}<br>
      • 나눠서 생각해도 돼요. 예: ${a}×${b} = ${a}×5 + ${a}×${b-5}
    `;}

    btnCheckPractice.onclick=()=>{
      const v=parseInt(ansPractice.value,10);
      if(v===a*b){
        resPractice.innerHTML=`<span class="ok">정답! 👍</span>`;
        hintPractice.style.display='none';btnShowAnswer.style.display='none';
      }else{
        resPractice.innerHTML=`<span class="ng">틀렸어요 😅 다시 시도해보세요</span>`;
        hintPractice.innerHTML=makeHint(a,b);hintPractice.style.display='block';
        btnShowAnswer.style.display='inline-block';
        btnShowAnswer.onclick=()=>{resPractice.innerHTML=`정답은 <strong>${a*b}</strong> 입니다.`;btnShowAnswer.style.display='none';};
      }
    };
    btnNextPractice.onclick=makePracticeQ;
    ansPractice.addEventListener('keydown',e=>{if(e.key==='Enter')btnCheckPractice.click();});
    makePracticeQ();

    // 게임 모드
    const qGame=document.getElementById('qGame');const ansGame=document.getElementById('ansGame');const resGame=document.getElementById('resGame');
    const btnCheckGame=document.getElementById('btnCheckGame');const btnStartGame=document.getElementById('btnStartGame');
    const scoreNow=document.getElementById('scoreNow');const timeLeft=document.getElementById('timeLeft');const bestScoreEl=document.getElementById('bestScore');bestScoreEl.textContent=`최고점: ${best}`;

    function makeGameQ(){a=rndInt(2,9);b=rndInt(1,9);qGame.textContent=`${a} × ${b} = ?`;ansGame.value='';resGame.textContent='';}
    function drawHud(){scoreNow.textContent=`점수: ${score}`;timeLeft.textContent=`남은 시간: ${tLeft}초`;}
    function tick(){tLeft--;drawHud();if(tLeft<=0)endGame();}
    function startGame(){if(timer)clearInterval(timer);score=0;tLeft=30;drawHud();makeGameQ();timer=setInterval(tick,1000);}
    function endGame(){clearInterval(timer);timer=null;resGame.innerHTML=`게임 종료! 최종 점수: ${score}`;if(score>best){best=score;localStorage.setItem('gugu_best',best);bestScoreEl.textContent=`최고점: ${best}`;}}
    btnStartGame.onclick=startGame;
    btnCheckGame.onclick=()=>{if(!timer){startGame();return;}const v=parseInt(ansGame.value,10);if(v===a*b){score+=10;resGame.innerHTML="정답! +10점";}else{resGame.innerHTML="오답 😅";}drawHud();makeGameQ();};
    ansGame.addEventListener('keydown',e=>{if(e.key==='Enter')btnCheckGame.click();});
  </script>
</body>
</html>
