<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>기초수학</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family:'Jua', sans-serif;
      margin:0;
      background:linear-gradient(to bottom,#a8edea,#fed6e3);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
    }
    .app {
      width:100%;
      max-width:480px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 6px 20px rgba(0,0,0,.1);
      padding:16px;
    }
    h1 { text-align:center; margin:0 0 16px; font-size:26px; }

    /* 상단 모드 버튼 */
    .tabs {
      display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;
    }
    .tabs button {
      border:none; border-radius:999px; padding:10px 16px;
      font-size:16px; background:#ff9a9e; color:#fff; cursor:pointer;
      transition:.2s;
    }
    .tabs button.active, .tabs button:hover { background:#ff6a88; }

    /* 난이도 버튼 */
    .levels {
      display:flex; gap:8px; justify-content:center; margin-bottom:16px;
    }
    .levels button {
      border:2px solid #ff9a9e; border-radius:999px; padding:8px 14px;
      font-size:15px; background:#fff; color:#ff6a88; cursor:pointer;
      transition:.2s;
    }
    .levels button.active, .levels button:hover {
      background:#ff9a9e; color:#fff;
    }

    .card {
      border:2px solid #f1f5f9; border-radius:14px; padding:14px;
    }
    .q { font-size:30px; text-align:center; margin:14px 0; min-height:40px; }
    #vizGrid { text-align:center; margin:6px 0; }
    .viz-row { line-height:1.6; font-size:20px; }

    #answerDisplay {
      width:100%; text-align:center;
      font-size:28px; padding:12px; border:2px solid #ddd; border-radius:10px;
      margin-bottom:12px; min-height:40px; background:#fafafa;
    }

    /* 숫자 키패드 */
    .num-pad {
      display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px;
    }
    .num-pad button {
      font-size:22px; padding:16px; border:none; border-radius:12px;
      background:#e5e7eb; cursor:pointer;
      transition:.2s;
    }
    .num-pad button:active { background:#d1d5db; }
    .num-pad button.action { background:#475569; color:#fff; }

    /* 하단 버튼 */
    .btn {
      border:none; border-radius:10px; padding:12px; font-size:16px;
      cursor:pointer; background:#ff9a9e; color:#fff; width:100%;
    }
    .btn:hover { background:#ff6a88; }

    .result { text-align:center; font-size:18px; min-height:24px; margin:8px 0; }
    .ok { color:#1a9c50; }
    .ng { color:#d93025; }
    .hint {
      margin-top:8px; background:#fff7ed; border:1px solid #fed7aa; color:#7c2d12;
      padding:8px 10px; border-radius:10px; font-size:15px; display:none;
    }
    .hint strong { color:#b45309; }

    #btnShowAnswer {
      display:none; width:100%; padding:10px; margin-top:8px;
      font-size:16px; border:none; border-radius:10px;
      background:#475569; color:#fff; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>기초수학</h1>

    <div class="tabs">
      <button onclick="setMode('add')">덧셈</button>
      <button onclick="setMode('sub')">뺄셈</button>
      <button onclick="setMode('mul')">곱셈</button>
      <button onclick="setMode('mix')">전체</button>
    </div>

    <div class="levels">
      <button onclick="setLevel('easy')">쉬움</button>
      <button onclick="setLevel('normal')">보통</button>
      <button onclick="setLevel('hard')">어려움</button>
    </div>

    <div class="card">
      <div class="q" id="question">모드를 선택하세요</div>
      <div id="vizGrid"></div>
      <div id="answerDisplay"></div>
      <div class="num-pad">
        <button onclick="pressNum(1)">1</button>
        <button onclick="pressNum(2)">2</button>
        <button onclick="pressNum(3)">3</button>
        <button onclick="pressNum(4)">4</button>
        <button onclick="pressNum(5)">5</button>
        <button onclick="pressNum(6)">6</button>
        <button onclick="pressNum(7)">7</button>
        <button onclick="pressNum(8)">8</button>
        <button onclick="pressNum(9)">9</button>
        <button onclick="pressDel()" class="action">⌫</button>
        <button onclick="pressNum(0)">0</button>
        <button onclick="checkAnswer()" class="action">확인</button>
      </div>
      <button class="btn" onclick="newQuestion()">다음 문제</button>
      <div id="result" class="result"></div>
      <div id="hint" class="hint"></div>
      <button id="btnShowAnswer">정답 보기</button>
    </div>
  </div>

  <script>
    let mode=null, level="easy";
    let a=0,b=0,op="",correct=0;
    const qEl=document.getElementById('question');
    const resEl=document.getElementById('result');
    const hintEl=document.getElementById('hint');
    const btnShow=document.getElementById('btnShowAnswer');
    const viz=document.getElementById('vizGrid');
    const ansDisplay=document.getElementById('answerDisplay');
    let answer="";

    function rndInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

    function setMode(m){
      mode=m;
      document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
      event.target.classList.add('active');
      newQuestion();
    }

    function setLevel(l){
      level=l;
      document.querySelectorAll('.levels button').forEach(b=>b.classList.remove('active'));
      event.target.classList.add('active');
      newQuestion();
    }

    function newQuestion(){
      resEl.textContent=""; hintEl.style.display="none"; btnShow.style.display="none"; viz.innerHTML="";
      answer=""; ansDisplay.textContent="";
      if(mode==="add"){ 
        let max = level==="easy"?20:level==="normal"?50:100;
        a=rndInt(1,max); b=rndInt(1,max); op="+"; correct=a+b;
        qEl.textContent=`${a} + ${b} = ?`;
      }
      else if(mode==="sub"){
        let max = level==="easy"?20:level==="normal"?50:100;
        a=rndInt(1,max); b=rndInt(1,max);
        if(b>a)[a,b]=[b,a];
        op="-"; correct=a-b; qEl.textContent=`${a} - ${b} = ?`;
      }
      else if(mode==="mul"){
        if(level==="easy"){a=rndInt(2,5); b=rndInt(1,5);}
        else if(level==="normal"){a=rndInt(2,9); b=rndInt(1,9);}
        else {a=rndInt(2,12); b=rndInt(2,12);}
        op="×"; correct=a*b;
        if(Math.random()<0.5){
          qEl.textContent=`사과 ${a}개가 ${b}줄 있으면 모두 몇 개인가요?`;
        }else{
          qEl.textContent=`${a} × ${b} = ?`;
        }
        drawApples(a,b);
      }
      else if(mode==="mix"){
        const pick=["add","sub","mul"][rndInt(0,2)];
        setMode(pick); return;
      }
    }

    function drawApples(a,b){
      let html="";
      for(let i=0;i<b;i++){html+=`<div class="viz-row">${"🍎".repeat(a)}</div>`;}
      viz.innerHTML=html;
    }

    function makeHint(){
      if(op==="+") return `${a}+${b}는 ${a}부터 ${b}만큼 더 가는 거예요.`;
      if(op==="-") return `${a}-${b}는 ${a}에서 ${b}만큼 빼는 거예요.`;
      if(op==="×") return `${a}×${b}는 ${a}를 ${b}번 더한 것과 같아요.<br>예: ${Array(b).fill(a).join(" + ")}`;
      return "";
    }

    function checkAnswer(){
      const v=parseInt(answer,10);
      if(v===correct){
        resEl.innerHTML=`<span class="ok">정답! 👍</span>`;
        hintEl.style.display="none"; btnShow.style.display="none";
      }else{
        resEl.innerHTML=`<span class="ng">틀렸어요 😅 다시 시도해보세요</span>`;
        hintEl.innerHTML=makeHint(); hintEl.style.display="block";
        btnShow.style.display="inline-block";
        btnShow.onclick=()=>{resEl.innerHTML=`정답은 <strong>${correct}</strong> 입니다.`;btnShow.style.display="none";};
      }
    }

    function pressNum(n){
      if(answer.length<5){answer+=n; ansDisplay.textContent=answer;}
    }
    function pressDel(){
      answer=answer.slice(0,-1); ansDisplay.textContent=answer;
    }

    // 시작 시
    setMode('add'); setLevel('easy');
  </script>
</body>
</html>
