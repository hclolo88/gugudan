<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>구구단 연습 & 게임</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-1:#a8edea; --bg-2:#fed6e3;
      --primary:#ff9a9e; --primary-hover:#ff6a88;
      --ok:#1a9c50; --ng:#d93025; --ink:#333;
      --card:#ffffff; --muted:#6b7280;
    }
    *{box-sizing:border-box}
    body{
      font-family:'Jua', sans-serif;
      margin:0; background:linear-gradient(to bottom,var(--bg-1),var(--bg-2));
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .app{
      width:min(920px,100%); background:var(--card); border-radius:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.08); padding:24px;
    }
    h1{margin:0 0 8px; color:var(--ink); text-align:center}
    .sub{color:var(--muted); text-align:center; margin:0 0 20px}
    .tabs{display:flex; gap:12px; justify-content:center; margin-bottom:16px}
    .tabs button{
      border:none; border-radius:999px; padding:12px 22px; font-size:18px;
      background:var(--primary); color:#fff; cursor:pointer; transition:.2s;
    }
    .tabs button:hover{ background:var(--primary-hover) }
    .panel{ display:none }
    .panel.active{ display:block }

    .card{
      background:#fff; border:2px solid #f1f5f9; border-radius:18px; padding:18px;
    }
    .row{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; justify-content:center }

    .level button{
      border:2px solid #e5e7eb; background:#f9fafb; color:#111827;
      border-radius:12px; padding:10px 14px; font-size:18px; cursor:pointer; transition:.2s;
    }
    .level button.active, .level button:hover{ border-color:var(--primary); background:#fff }

    .q{ font-size:46px; text-align:center; color:#111; margin:16px 0 }
    .inputs{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap }
    input[type="number"]{
      width:160px; font-size:22px; padding:10px 12px; border-radius:12px;
      border:2px solid #e2e8f0; outline:none;
    }
    .btn{
      border:none; border-radius:12px; padding:10px 16px; font-size:18px; cursor:pointer;
      background:#111827; color:#fff;
    }
    .btn.secondary{ background:#475569 }
    .result{ min-height:30px; text-align:center; font-size:20px; margin-top:10px }
    .ok{ color:var(--ok) } .ng{ color:var(--ng) }

    .scorebar{
      display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px;
      color:#0b5cab; font-size:18px;
    }
    .badge{
      background:#eef2ff; color:#3730a3; padding:6px 10px; border-radius:999px; border:1px solid #c7d2fe;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>구구단 연습 & 게임</h1>
    <p class="sub">쉬운 문제부터 차근차근, 재미있게 익혀요!</p>

    <div class="tabs">
      <button id="tabPractice">연습 모드</button>
      <button id="tabGame">게임 모드</button>
    </div>

    <!-- 연습 모드 -->
    <div id="panelPractice" class="panel active">
      <div class="card" style="margin-bottom:12px">
        <div class="row level">
          <span style="font-size:18px;color:#374151">난이도:</span>
          <button data-level="easy">쉬움(2~3단)</button>
          <button data-level="normal">보통(2~5단)</button>
          <button data-level="hard">어려움(2~9단)</button>
        </div>
      </div>

      <div class="card">
        <div id="qPractice" class="q">난이도를 선택하세요</div>
        <div class="inputs">
          <input type="number" id="ansPractice" placeholder="답 입력" />
          <button class="btn" id="btnCheckPractice">확인</button>
          <button class="btn secondary" id="btnNextPractice">다음 문제</button>
        </div>
        <div id="resPractice" class="result"></div>
      </div>
    </div>

    <!-- 게임 모드 -->
    <div id="panelGame" class="panel">
      <div class="card">
        <div id="qGame" class="q">시작 버튼을 눌러요!</div>
        <div class="inputs">
          <input type="number" id="ansGame" placeholder="답 입력" />
          <button class="btn" id="btnCheckGame">확인</button>
          <button class="btn secondary" id="btnStartGame">다시 시작</button>
        </div>
        <div id="resGame" class="result"></div>
        <div class="scorebar">
          <span class="badge" id="scoreNow">점수: 0</span>
          <span class="badge" id="timeLeft">남은 시간: 30초</span>
          <span class="badge" id="bestScore">최고점: 0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---------- 공통 상태 ----------
    let a=0,b=0;
    const speak = (t)=>{
      // 첫 사용자 상호작용 전에는 일부 브라우저에서 차단될 수 있음
      try{
        const u = new SpeechSynthesisUtterance(t);
        u.lang = "ko-KR";
        window.speechSynthesis.speak(u);
      }catch(_){}
    };

    // ---------- 탭 ----------
    const panelPractice = document.getElementById('panelPractice');
    const panelGame     = document.getElementById('panelGame');
    document.getElementById('tabPractice').onclick = ()=>{
      panelPractice.classList.add('active'); panelGame.classList.remove('active');
    };
    document.getElementById('tabGame').onclick = ()=>{
      panelGame.classList.add('active'); panelPractice.classList.remove('active');
    };

    // ---------- 연습 모드 ----------
    const qPractice   = document.getElementById('qPractice');
    const ansPractice = document.getElementById('ansPractice');
    const resPractice = document.getElementById('resPractice');
    const btnCheckPractice = document.getElementById('btnCheckPractice');
    const btnNextPractice  = document.getElementById('btnNextPractice');

    let level = localStorage.getItem('gugu_level') || 'easy';
    const levelButtons = document.querySelectorAll('.level button');
    levelButtons.forEach(btn=>{
      if(btn.dataset.level===level) btn.classList.add('active');
      btn.onclick = ()=>{
        levelButtons.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        level = btn.dataset.level;
        localStorage.setItem('gugu_level', level);
        makePracticeQ();
      };
    });

    function rangeFor(level){
      if(level==='easy')   return [2,3];
      if(level==='normal') return [2,5];
      return [2,9];
    }
    function rndInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

    function makePracticeQ(){
      const [lo,hi] = rangeFor(level);
      a = rndInt(lo,hi);
      b = rndInt(1,9);
      qPractice.textContent = `${a} × ${b} = ?`;
      ansPractice.value = '';
      resPractice.textContent = '';
      ansPractice.focus();
      speak(`${a} 곱하기 ${b}는 얼마일까요?`);
    }

    btnNextPractice.onclick  = makePracticeQ;
    btnCheckPractice.onclick = ()=>{
      const v = parseInt(ansPractice.value,10);
      if(v === a*b){
        resPractice.innerHTML = `<span class="ok">정답! 👍</span>`;
        speak('정답입니다!');
      }else{
        resPractice.innerHTML = `<span class="ng">틀렸어요 😅 (정답: ${a*b})</span>`;
        speak('틀렸습니다. 다시 도전!');
      }
      ansPractice.focus();
    };
    ansPractice.addEventListener('keydown', e=>{ if(e.key==='Enter') btnCheckPractice.click(); });

    // 초기 문제 세팅
    makePracticeQ();

    // ---------- 게임 모드 ----------
    const qGame     = document.getElementById('qGame');
    const ansGame   = document.getElementById('ansGame');
    const resGame   = document.getElementById('resGame');
    const btnCheckGame = document.getElementById('btnCheckGame');
    const btnStartGame = document.getElementById('btnStartGame');
    const scoreNow  = document.getElementById('scoreNow');
    const timeLeft  = document.getElementById('timeLeft');
    const bestScoreEl = document.getElementById('bestScore');

    let score=0, tLeft=30, timer=null;
    let best = parseInt(localStorage.getItem('gugu_best')||'0',10);
    bestScoreEl.textContent = `최고점: ${best}`;

    function makeGameQ(){
      a = rndInt(2,9); b = rndInt(1,9);
      qGame.textContent = `${a} × ${b} = ?`;
      ansGame.value=''; resGame.textContent=''; ansGame.focus();
      speak(`${a} 곱하기 ${b}`);
    }
    function tick(){
      tLeft--; drawHud();
      if(tLeft<=0){ endGame(); }
    }
    function drawHud(){
      scoreNow.textContent = `점수: ${score}`;
      timeLeft.textContent = `남은 시간: ${tLeft}초`;
    }
    function startGame(){
      if(timer) clearInterval(timer);
      score=0; tLeft=30; drawHud(); makeGameQ();
      resGame.textContent='';
      timer=setInterval(tick,1000);
    }
    function endGame(){
      clearInterval(timer); timer=null;
      resGame.innerHTML = `<span class="ok">게임 종료! 최종 점수: ${score}</span>`;
      if(score>best){
        best=score; localStorage.setItem('gugu_best', String(best));
        bestScoreEl.textContent = `최고점: ${best}`;
        speak(`새 기록! ${best}점`);
      }else{
        speak(`게임 종료! ${score}점`);
      }
    }
    btnStartGame.onclick = startGame;
    btnCheckGame.onclick = ()=>{
      if(!timer){ // 아직 시작 안 했으면 시작
        startGame(); return;
      }
      const v = parseInt(ansGame.value,10);
      if(v === a*b){
        score += 10;
        resGame.innerHTML = `<span class="ok">정답! +10점</span>`;
        speak('정답!');
      }else{
        resGame.innerHTML = `<span class="ng">앗, 오답! (정답: ${a*b})</span>`;
        speak('아쉽다!');
      }
      drawHud(); makeGameQ();
    };
    ansGame.addEventListener('keydown', e=>{ if(e.key==='Enter') btnCheckGame.click(); });
  </script>
</body>
</html>
