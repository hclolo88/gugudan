<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>구구단 원정대</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#DCEBF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161B2A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23FFC53D'/><circle cx='50' cy='54' r='30' fill='%23F0C177' stroke='%231F2430' stroke-width='6'/><circle cx='38' cy='50' r='5'/><circle cx='62' cy='50' r='5'/></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Jua&display=swap">
<style>
:root{
  --bg:#DCEBF7; --bg2:#C9E0F2;
  --surface:#FFFFFF; --surface-2:#EEF4FA;
  --ink:#1F2430; --muted:#6B7688; --faint:#C6D3E2;
  --gold:#FFC53D; --grass:#4FB477; --berry:#FF6B7A; --sky:#4EA8DE; --plum:#9B7EDE;
  --lock:#B9C6D6;
  --ko:'Jua',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --nm:'Fredoka','Jua',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161B2A; --bg2:#111524;
    --surface:#232A3D; --surface-2:#2C3448;
    --ink:#EDF2FF; --muted:#99A4BE; --faint:#3A4459;
    --gold:#FFD166; --grass:#68D294; --berry:#FF8A96; --sky:#6FC0EE; --plum:#B79BF0;
    --lock:#4A5568;
  }
}
:root[data-theme="dark"]{
  --bg:#161B2A; --bg2:#111524;
  --surface:#232A3D; --surface-2:#2C3448;
  --ink:#EDF2FF; --muted:#99A4BE; --faint:#3A4459;
  --gold:#FFD166; --grass:#68D294; --berry:#FF8A96; --sky:#6FC0EE; --plum:#B79BF0;
  --lock:#4A5568;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ko); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.n{font-family:var(--nm);font-variant-numeric:tabular-nums;font-weight:600}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- shared comic frame ---------- */
.frame{background:var(--surface);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);
  border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:15px;font-size:18px;background:var(--surface);
  transition:transform .07s ease,box-shadow .07s ease}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.go{background:var(--gold);color:#1F2430}
.btn.ghost{background:var(--surface)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;flex:none;margin-bottom:12px}
.icon{width:42px;height:42px;flex:none;border:3px solid var(--ink);border-radius:13px;background:var(--surface);
  box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:18px}
.icon:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.title{font-size:20px;flex:1}
.coin{display:flex;align-items:center;gap:6px;background:var(--gold);color:#1F2430;border:3px solid var(--ink);
  border-radius:999px;padding:5px 13px 5px 9px;box-shadow:0 3px 0 var(--ink);font-family:var(--nm);font-weight:600}
.coin b{font-size:16px}
.coin em{font-style:normal;font-size:15px}

/* ---------- map ---------- */
.path{position:relative;padding:4px 0 20px}
.path::before{content:"";position:absolute;top:30px;bottom:60px;left:50%;width:6px;margin-left:-3px;
  background:repeating-linear-gradient(var(--faint) 0 12px,transparent 12px 24px);border-radius:3px}
.node{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;width:78%}
.node:nth-child(even){margin-left:22%;flex-direction:row-reverse;text-align:right}
.node .bub{flex:1;background:var(--surface);border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--ink);padding:11px 14px;transition:transform .07s ease,box-shadow .07s ease}
.node:active .bub{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.node .who{font-size:17px;line-height:1.2}
.node .sub{font-size:12.5px;color:var(--muted);font-family:var(--nm);font-weight:500}
.node .stars{font-size:14px;letter-spacing:2px;color:var(--gold);line-height:1.2}
.node .stars i{font-style:normal;color:var(--faint)}
.disc{width:74px;height:74px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--surface-2);
  box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;overflow:hidden;position:relative}
.disc svg{width:88%;height:88%;display:block}
.node.locked .disc{background:var(--lock)}
.node.locked .disc svg{filter:grayscale(1);opacity:.35}
.node.locked .bub{opacity:.6}
.node.locked .disc::after{content:"🔒";position:absolute;font-size:24px;filter:none;opacity:1}
.node.boss .disc{width:84px;height:84px;background:var(--gold)}
.tag{display:inline-block;font-family:var(--nm);font-weight:600;font-size:12px;background:var(--ink);
  color:var(--surface);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px}
.tag.fix{background:var(--berry);color:#fff}

/* ---------- play ---------- */
.dots{display:flex;gap:5px;justify-content:center;flex:none;margin-bottom:10px}
.dots i{width:100%;max-width:22px;height:7px;border-radius:4px;background:var(--faint)}
.dots i.ok{background:var(--grass)}
.dots i.no{background:var(--berry)}
.arena{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.buddy{display:flex;align-items:flex-end;gap:10px;min-height:0}
.buddy .pic{width:clamp(64px,19vw,92px);flex:none}
.buddy .pic svg{width:100%;height:auto;display:block}
.say{flex:1;position:relative;background:var(--surface);border:3px solid var(--ink);border-radius:16px;
  padding:10px 13px;font-size:15px;box-shadow:0 4px 0 var(--ink);min-height:44px;display:flex;align-items:center}
.say::before{content:"";position:absolute;left:-11px;bottom:14px;width:0;height:0;
  border:7px solid transparent;border-right-color:var(--ink);border-left:0}
.say::after{content:"";position:absolute;left:-6px;bottom:14px;width:0;height:0;
  border:7px solid transparent;border-right-color:var(--surface);border-left:0}
.say .n{font-size:17px}

.prob{background:var(--surface);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);
  padding:18px 14px;text-align:center;position:relative}
.prob.ok{background:color-mix(in srgb,var(--grass) 18%,var(--surface))}
.prob.no{background:color-mix(in srgb,var(--berry) 18%,var(--surface))}
.eq{font-family:var(--nm);font-weight:500;font-size:clamp(38px,12.5vw,62px);line-height:1.05}
.eq .op{color:var(--muted);margin:0 .1em}
.eq .sl{color:var(--sky);min-width:2.1ch;display:inline-block}
.eq .sl.off{color:var(--faint)}
.prob.ok .eq .sl{color:var(--grass)}
.prob.no .eq .sl{color:var(--berry)}
.combo{position:absolute;top:-14px;right:12px;background:var(--berry);color:#fff;border:3px solid var(--ink);
  border-radius:999px;padding:2px 11px;font-family:var(--nm);font-weight:600;font-size:13px;
  box-shadow:0 3px 0 var(--ink);opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.combo.on{opacity:1;transform:scale(1)}
.gain{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-family:var(--nm);font-weight:600;
  font-size:22px;color:var(--grass);opacity:0;pointer-events:none}
.gain.run{animation:float 1s ease-out}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
.wob{animation:wob .35s}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.hop{animation:hop .4s}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-12px)}70%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.wob,.hop,.gain.run{animation:none}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex:none;margin-top:10px}
.k{height:clamp(54px,8.6vh,72px);border:3px solid var(--ink);border-radius:15px;background:var(--surface);
  box-shadow:0 4px 0 var(--ink);font-family:var(--nm);font-weight:500;font-size:26px;display:grid;place-items:center;
  transition:transform .06s ease,box-shadow .06s ease}
.k:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
/* 가로로 눕힌 화면처럼 세로가 짧을 때 */
@media (max-height:560px){
  .topbar,.dots{margin-bottom:6px}
  .k{height:clamp(38px,10.5vh,54px);font-size:21px}
  .pad{gap:7px;margin-top:7px}
  .buddy .pic{width:54px}
  .arena{gap:6px}
  .prob{padding:9px 12px}
  .eq{font-size:clamp(28px,8.5vh,44px)}
  .say{min-height:36px;padding:7px 11px;font-size:14px}
}
.k.u{background:var(--surface-2);font-size:21px;color:var(--muted)}
.k.e{background:var(--gold);color:#1F2430}

/* ---------- clear ---------- */
.clear{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.clear .pic{width:118px}
.clear .pic svg{width:100%;height:auto;display:block}
.starrow{display:flex;gap:10px;font-size:44px;color:var(--faint);line-height:1}
.starrow span{transform:scale(.4);opacity:0}
.starrow span.win{color:var(--gold);animation:pop .45s forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
.headline{font-size:25px}
.sumline{font-family:var(--nm);font-weight:500;color:var(--muted);font-size:15px}
.bigscore{font-family:var(--nm);font-weight:700;font-size:46px;color:var(--gold);-webkit-text-stroke:2.5px var(--ink);line-height:1.1}
.misslist{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-height:20vh;overflow-y:auto}
.misslist span{font-family:var(--nm);font-weight:500;font-size:14px;background:var(--surface);
  border:2.5px solid var(--berry);color:var(--berry);border-radius:11px;padding:5px 10px}
.foot{flex:none;display:flex;flex-direction:column;gap:9px;padding-top:14px}
.frow{display:flex;gap:9px}
.frow .btn{flex:1;font-size:16px;padding:13px}

/* ---------- settings ---------- */
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 15px;
  border-bottom:2.5px dashed var(--faint)}
.row:last-child{border-bottom:0}
.row .lab{font-size:16px}
.row .hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:3px}
.sw{width:56px;height:32px;flex:none;border:3px solid var(--ink);border-radius:999px;background:var(--surface-2);position:relative}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:var(--muted);transition:transform .18s ease}
.sw[aria-pressed="true"]{background:var(--grass)}
.sw[aria-pressed="true"]::after{background:#fff;transform:translateX(24px)}
.code{font-family:var(--nm);font-weight:600;font-size:17px;letter-spacing:.06em;background:var(--surface-2);
  border:3px solid var(--ink);border-radius:12px;padding:9px 13px;min-width:120px;text-align:center;color:var(--ink)}
.status{font-family:var(--nm);font-weight:500;font-size:13px;padding:4px 11px;border-radius:999px;
  border:2.5px solid var(--ink);background:var(--surface-2)}
.status.live{background:var(--grass);color:#0C1A12}
.danger{color:var(--berry);font-size:14px;text-decoration:underline;padding:14px;align-self:center}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;padding:14px 15px;background:var(--surface-2);
  border-radius:13px;margin-top:14px}
</style>
</head>
<body>
<div id="app">

<!-- ============ MAP ============ -->
<section class="screen on" id="s-map">
  <div class="topbar">
    <div class="title">구구단 원정대</div>
    <div class="coin"><em>⭐</em><b class="n" id="m-score">0</b></div>
    <button class="icon" id="to-set" aria-label="설정">⚙</button>
  </div>
  <div class="scroll" style="flex:1;min-height:0">
    <div class="path" id="path"></div>
  </div>
</section>

<!-- ============ PLAY ============ -->
<section class="screen" id="s-play">
  <div class="topbar">
    <button class="icon" id="quit" aria-label="그만두기">✕</button>
    <div class="title n" id="p-stage">2단</div>
    <div class="coin"><em>⭐</em><b class="n" id="p-score">0</b></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="arena">
    <div class="buddy">
      <div class="pic" id="p-pic"></div>
      <div class="say" id="p-say">준비됐니?</div>
    </div>
    <div class="prob" id="prob">
      <div class="combo n" id="combo">콤보 2</div>
      <div class="gain n" id="gain">+100</div>
      <div class="eq"><span id="ea">2</span><span class="op">×</span><span id="eb">3</span><span class="op">=</span><span class="sl off" id="slot">?</span></div>
    </div>
  </div>
  <div class="pad" id="pad"></div>
</section>

<!-- ============ CLEAR ============ -->
<section class="screen" id="s-clear">
  <div class="clear">
    <div class="pic" id="c-pic"></div>
    <div class="starrow" id="c-stars"><span>★</span><span>★</span><span>★</span></div>
    <div class="headline" id="c-head">클리어!</div>
    <div class="bigscore n" id="c-score">0</div>
    <div class="sumline" id="c-sum">10문제 중 9개 정답</div>
    <div class="misslist" id="c-miss"></div>
  </div>
  <div class="foot">
    <button class="btn go" id="c-next">다음 단으로</button>
    <div class="frow">
      <button class="btn ghost" id="c-retry">다시 도전</button>
      <button class="btn ghost" id="c-map">지도로</button>
    </div>
  </div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="screen scroll" id="s-set">
  <div class="topbar">
    <button class="icon" id="set-back" aria-label="뒤로">←</button>
    <div class="title">설정</div>
  </div>
  <div class="frame">
    <div class="row">
      <div><div class="lab">소리</div></div>
      <button class="sw" id="sound" aria-pressed="true" aria-label="소리 켜기"></button>
    </div>
    <div class="row">
      <div style="flex:1">
        <div class="lab">이어하기 코드 <span class="status" id="sync-st">로컬 저장</span></div>
        <div class="hint" id="sync-hint">같은 코드를 넣은 기기끼리 점수와 오답이 이어집니다.</div>
      </div>
      <button class="code" id="slotbtn">없음</button>
    </div>
    <div class="row">
      <div><div class="lab">기록</div><div class="hint n" id="set-sum">0점 · 별 0개</div></div>
      <button class="code" id="syncnow">동기화</button>
    </div>
  </div>
  <div class="note" id="cloudnote"></div>
  <button class="danger" id="wipe">기록 모두 지우기</button>
</section>

</div>

<script>
(function(){
"use strict";

/* =====================================================================
   클라우드 이어하기 설정 (선택)
   Firebase 콘솔에서 프로젝트를 만든 뒤 아래 두 줄만 채우면
   여러 기기에서 점수와 오답이 이어집니다. 비워두면 기기 저장만 씁니다.
   ===================================================================== */
var CLOUD = {
  projectId: "",
  apiKey: ""
};
/* ===================================================================== */

var $ = function(s){ return document.querySelector(s); };
var SAVE = "gugu.quest.v1";
var STAGES = [2,3,4,5,6,7,8,9];

/* ---------------- 캐릭터 ---------------- */
var CAST = {
  2:{name:"토실",  kind:"hamster", c1:"#F0C177", c2:"#D99B4A", ex:13, ey:51, my:64},
  3:{name:"초코",  kind:"bear",    c1:"#B98055", c2:"#8F5B37", ex:13, ey:50, my:67},
  4:{name:"바다",  kind:"penguin", c1:"#41608E", c2:"#2B4166", ex:12, ey:47, my:0 },
  5:{name:"단풍",  kind:"fox",     c1:"#EE8B4F", c2:"#CF6A2F", ex:13, ey:50, my:66},
  6:{name:"뭉게",  kind:"sheep",   c1:"#F6F3ED", c2:"#D6D0C3", ex:11, ey:54, my:66},
  7:{name:"별이",  kind:"cat",     c1:"#9AA3B5", c2:"#78818F", ex:13, ey:52, my:65},
  8:{name:"개굴",  kind:"frog",    c1:"#7BC26A", c2:"#559B45", ex:19, ey:33, my:66},
  9:{name:"부엉",  kind:"owl",     c1:"#A97FC4", c2:"#8760A4", ex:13, ey:50, my:0 },
  all:{name:"무지",kind:"dragon",  c1:"#5FC9C1", c2:"#37A79E", ex:13, ey:48, my:65},
  fix:{name:"깜박",kind:"ghost",   c1:"#C9D4E6", c2:"#A6B4CC", ex:13, ey:48, my:64}
};

function body(c){
  var a=c.c1, b=c.c2;
  switch(c.kind){
    case "hamster": return '<circle cx="25" cy="31" r="11" fill="'+b+'"/><circle cx="75" cy="31" r="11" fill="'+b+'"/>'+
      '<circle cx="50" cy="57" r="33" fill="'+a+'"/>'+
      '<ellipse cx="29" cy="66" rx="8" ry="5.5" fill="'+b+'" stroke="none" opacity=".5"/>'+
      '<ellipse cx="71" cy="66" rx="8" ry="5.5" fill="'+b+'" stroke="none" opacity=".5"/>';
    case "bear": return '<circle cx="24" cy="28" r="12" fill="'+b+'"/><circle cx="76" cy="28" r="12" fill="'+b+'"/>'+
      '<circle cx="50" cy="57" r="34" fill="'+a+'"/>'+
      '<ellipse cx="50" cy="68" rx="16" ry="12" fill="#FFF2DF"/>'+
      '<ellipse cx="50" cy="62" rx="5" ry="3.6" fill="#2A2018" stroke="none"/>';
    case "penguin": return '<ellipse cx="50" cy="58" rx="31" ry="35" fill="'+a+'"/>'+
      '<ellipse cx="50" cy="67" rx="19.5" ry="25" fill="#FFFDF7"/>'+
      '<path d="M50 55 L59 62 L50 69 L41 62 Z" fill="#F5A93C"/>';
    case "fox": return '<path d="M20 36 L24 10 L42 25 Z" fill="'+a+'"/><path d="M80 36 L76 10 L58 25 Z" fill="'+a+'"/>'+
      '<circle cx="50" cy="56" r="32" fill="'+a+'"/>'+
      '<path d="M31 60 Q50 52 69 60 Q62 82 50 82 Q38 82 31 60 Z" fill="#FFF6EC"/>'+
      '<ellipse cx="50" cy="66" rx="5" ry="3.8" fill="#2A2018" stroke="none"/>';
    case "sheep": return '<circle cx="26" cy="42" r="14" fill="'+a+'"/><circle cx="74" cy="42" r="14" fill="'+a+'"/>'+
      '<circle cx="33" cy="24" r="14" fill="'+a+'"/><circle cx="67" cy="24" r="14" fill="'+a+'"/>'+
      '<circle cx="50" cy="18" r="14" fill="'+a+'"/><circle cx="50" cy="42" r="17" fill="'+a+'"/>'+
      '<ellipse cx="50" cy="60" rx="23" ry="25" fill="#F0DCC6"/>'+
      '<ellipse cx="26" cy="58" rx="6" ry="9" fill="'+b+'"/><ellipse cx="74" cy="58" rx="6" ry="9" fill="'+b+'"/>';
    case "cat": return '<path d="M25 34 L29 11 L46 26 Z" fill="'+a+'"/><path d="M75 34 L71 11 L54 26 Z" fill="'+a+'"/>'+
      '<circle cx="50" cy="57" r="33" fill="'+a+'"/>'+
      '<path d="M17 58 L32 61 M17 68 L32 66 M83 58 L68 61 M83 68 L68 66" stroke-width="2.6" fill="none"/>'+
      '<path d="M46 61 L54 61 L50 65 Z" fill="#4A3340" stroke="none"/>';

var G = { v:1, stars:{}, best:{}, open:2, stats:{}, sound:true, slot:"", t:0 };
try{
  var raw = localStorage.getItem(SAVE);
  if(raw){ var p=JSON.parse(raw); for(var k in p){ if(p[k]!==undefined) G[k]=p[k]; } }
}catch(e){}
function persist(){ G.t = Date.now(); try{ localStorage.setItem(SAVE, JSON.stringify(G)); }catch(e){} }
function total(){ var s=0; for(var k in G.best) s += G.best[k]||0; return s; }
function starTotal(){ var s=0; for(var k in G.stars) s += G.stars[k]||0; return s; }
function withRang(name){
  var last = name.charCodeAt(name.length-1) - 0xAC00;
  var batchim = last>=0 && last<11172 && last%28!==0;
  return name + (batchim ? "이랑" : "랑");
}
function fkey(a,b){ return Math.min(a,b)+"x"+Math.max(a,b); }
function fstat(k){ return G.stats[k] || (G.stats[k]={a:0,c:0,st:0}); }
function weakList(){
  var out=[]; for(var k in G.stats){ var s=G.stats[k]; if(s.a-s.c>0 && s.st<3) out.push(k); }
  out.sort(function(x,y){ return (G.stats[y].a-G.stats[y].c)-(G.stats[x].a-G.stats[x].c); });
  return out;
}

/* ---------------- 클라우드 ---------------- */
var syncing=false;
function cloudOn(){ return !!(CLOUD.projectId && CLOUD.apiKey && G.slot); }
function docURL(){
  return "https://firestore.googleapis.com/v1/projects/"+CLOUD.projectId+
         "/databases/(default)/documents/quest/"+encodeURIComponent(G.slot)+"?key="+CLOUD.apiKey;
}
function mergeIn(r){
  if(!r) return;
  var n;
  for(n in r.stars){ if(!(G.stars[n]>=r.stars[n])) G.stars[n]=r.stars[n]; }
  for(n in r.best){ if(!(G.best[n]>=r.best[n])) G.best[n]=r.best[n]; }
  if(r.open>G.open) G.open=r.open;
  for(n in r.stats){
    var mine=G.stats[n], theirs=r.stats[n];
    if(!mine || theirs.a>mine.a) G.stats[n]=theirs;
  }
}
function cloudPull(){
  if(!cloudOn()) return Promise.resolve(false);
  return fetch(docURL()).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if(!j || !j.fields || !j.fields.data) return false;
    mergeIn(JSON.parse(j.fields.data.stringValue)); persist(); return true;
  }).catch(function(){ return false; });
}
function cloudPush(){
  if(!cloudOn()) return Promise.resolve(false);
  var payload = {stars:G.stars, best:G.best, open:G.open, stats:G.stats, t:G.t};
  return fetch(docURL(), {
    method:"PATCH", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({fields:{data:{stringValue: JSON.stringify(payload)}}})
  }).then(function(r){ return r.ok; }).catch(function(){ return false; });
}
function syncAll(){
  if(!cloudOn() || syncing) return Promise.resolve(false);
  syncing = true; paintSet();
  return cloudPull().then(cloudPush).then(function(ok){
    syncing=false; paintSet(); paintMap(); return ok;
  });
}

var ac=null;
function beep(kind){
  if(!G.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.connect(g); g.connect(ac.destination); o.type="sine";
    if(kind==="ok"){ o.frequency.setValueAtTime(700,t); o.frequency.setValueAtTime(1050,t+0.07); }
    else if(kind==="no"){ o.type="triangle"; o.frequency.setValueAtTime(185,t); }
    else if(kind==="win"){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(880,t+0.11); o.frequency.setValueAtTime(1320,t+0.22); }
    else o.frequency.setValueAtTime(540,t);
    var peak = kind==="tap"?0.035:0.1, dur = kind==="win"?0.42:(kind==="no"?0.26:0.17);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}

/* ---------------- 문제 만들기 ---------------- */
function weight(k){
  var s=G.stats[k];
  if(!s||s.a===0) return 2.5;
  var w = 1 + (s.a-s.c)*2.2;
  if(s.st===0) w+=3; else if(s.st===1) w+=1.4; else if(s.st>=3) w*=0.45;
  return Math.max(0.35,w);
}
function flip(a,b){ return Math.random()<0.35 ? [b,a] : [a,b]; }
function makeQ(stage, n){
  var out=[], i, j, pool=[], used={};
  if(stage==="fix"){
    var weak=weakList(); if(!weak.length) return [];
    n = Math.min(12, Math.max(6, weak.length*2));
    for(i=0;i<n;i++){
      var k=weak[i%weak.length].split("x");
      var pr=flip(+k[0],+k[1]);
      out.push({a:pr[0], b:pr[1]});
    }
    for(i=out.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); var t=out[i]; out[i]=out[j]; out[j]=t; }
    return out;
  }
  var tables = stage==="all" ? STAGES.slice(0, Math.max(1, G.open-1)) : [stage];
  for(i=0;i<tables.length;i++) for(j=2;j<=9;j++) pool.push({a:tables[i], b:j});
  var last="";
  for(i=0;i<n;i++){
    var q=pickW(pool,used), guard=0;
    while(fkey(q.a,q.b)===last && pool.length>1 && guard++<8) q=pickW(pool,used);
    var key=fkey(q.a,q.b); used[key]=(used[key]||0)+1; last=key;
    var p=flip(q.a,q.b);
    out.push({a:p[0], b:p[1]});
  }
  return out;
}
function pickW(pool, used){
  var tot=0, ws=[], i;
  for(i=0;i<pool.length;i++){
    var k=fkey(pool[i].a,pool[i].b);
    var w=weight(k)/(1+(used[k]||0)*4);
    ws.push(w); tot+=w;
  }
  var r=Math.random()*tot;
  for(i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}

/* ---------------- 플레이 ---------------- */
var P=null;
var CHEER=["좋았어!","멋지다!","바로 그거야!","척척이네!","대단해!"];
function startStage(stage){
  var n = stage==="all" ? 20 : 10;
  var qs = makeQ(stage, n);
  if(!qs.length){ show("s-map"); return; }
  P = { stage:stage, qs:qs, i:0, right:0, score:0, combo:0, miss:[], phase:"ask", input:"", qt:0 };
  $("#p-stage").textContent = stage==="all" ? "전체 도전" : stage==="fix" ? "오답 도전" : stage+"단";
  var host=$("#dots"); host.innerHTML="";
  for(var i=0;i<qs.length;i++) host.appendChild(document.createElement("i"));
  buddy("idle", stage==="fix" ? "틀렸던 문제야. 이번엔 잡자!"
    : withRang(CAST[stage].name)+" "+(stage==="all" ? "전체 도전!" : stage+"단 가자!"));
  show("s-play"); renderQ();
}
function buddy(mood, text){
  $("#p-pic").innerHTML = draw(P.stage, mood);
  if(text!==undefined) $("#p-say").innerHTML = text;
}
function renderQ(){
  var q=P.qs[P.i];
  $("#ea").textContent=q.a; $("#eb").textContent=q.b;
  $("#prob").className="prob";
  P.input=""; P.phase="ask"; P.qt=Date.now();
  paintSlot();
  $("#p-score").textContent=P.score;
  $("#combo").classList.toggle("on", P.combo>=2);
  $("#combo").textContent="콤보 "+P.combo;
}
function paintSlot(){
  var el=$("#slot");
  el.textContent = P.input || "?";
  el.classList.toggle("off", !P.input);
}
function tap(v){
  if(!P) return;
  beep("tap");
  if(v==="del"){ P.input=P.input.slice(0,-1); paintSlot(); return; }
  if(v==="ok"){ if(P.input) check(); return; }
  if(P.input.length>=2) P.input="";
  P.input+=v; paintSlot();
  var want=String(P.qs[P.i].a*P.qs[P.i].b);
  if(P.input.length>=want.length) setTimeout(check,110);
}
function check(){
  var q=P.qs[P.i], want=q.a*q.b, got=parseInt(P.input,10);
  if(P.phase==="fix"){
    if(got===want){
      beep("ok"); buddy("happy","그렇지! 이제 외웠다.");
      $("#p-pic").firstChild.classList.add("hop");
      setTimeout(step,520);
    }else{
      P.input=""; paintSlot();
      $("#prob").classList.add("wob");
      setTimeout(function(){ $("#prob").classList.remove("wob"); },360);
    }
    return;
  }
  var s=fstat(fkey(q.a,q.b)); s.a++;
  var dot=$("#dots").children[P.i];
  if(got===want){
    s.c++; s.st++; P.right++; P.combo++;
    var secs=(Date.now()-P.qt)/1000;
    var gain = 100 + Math.min(P.combo-1,5)*20 + (secs<3?50:secs<6?20:0);
    P.score += gain;
    if(dot) dot.className="ok";
    beep("ok");
    $("#prob").className="prob ok";
    $("#p-score").textContent=P.score;
    var g=$("#gain"); g.textContent="+"+gain; g.classList.remove("run");
    void g.offsetWidth; g.classList.add("run");
    buddy("happy", P.combo>=3 ? '<span class="n">'+P.combo+'연속!</span> '+CHEER[P.combo%CHEER.length] : CHEER[Math.floor(Math.random()*CHEER.length)]);
    $("#p-pic").firstChild.classList.add("hop");
    persist();
    setTimeout(step,520);
  }else{
    s.st=0; P.combo=0;
    P.miss.push({a:q.a,b:q.b,v:want});
    if(dot) dot.className="no";
    beep("no");
    $("#prob").className="prob no wob";
    $("#combo").classList.remove("on");
    buddy("sad", '정답은 <span class="n">'+q.a+" × "+q.b+" = "+want+"</span>. 따라 눌러봐!");
    P.phase="fix"; P.input=""; paintSlot();
    persist();
  }
}
function step(){
  $("#prob").className="prob";
  var pic=$("#p-pic").firstChild; if(pic) pic.classList.remove("hop");
  P.i++;
  if(P.i>=P.qs.length) done(); else renderQ();
}
function done(){
  var n=P.qs.length, right=P.right, stage=P.stage;
  var rate = right/n;
  var got = P.stage==="fix" ? 0 : rate>=1 ? 3 : rate>=0.9 ? 2 : rate>=0.8 ? 1 : 0;
  var cleared = stage==="fix" ? true : got>0;

  if(stage!=="fix"){
    if(!G.stars[stage] || got>G.stars[stage]) G.stars[stage]=got;
    if(!G.best[stage] || P.score>G.best[stage]) G.best[stage]=P.score;
    if(got>0 && typeof stage==="number" && stage>=G.open && stage<9) G.open=stage+1;
    if(got>0 && stage===9 && G.open<9) G.open=9;
  }
  persist();
  if(cloudOn()) cloudPush();

  $("#c-pic").innerHTML = draw(stage, cleared?"happy":"sad");
  $("#c-stars").style.display = stage==="fix" ? "none" : "";
  var row=$("#c-stars").children, i;
  for(i=0;i<3;i++) row[i].className="";
  setTimeout(function(){
    for(i=0;i<got;i++) (function(k){ setTimeout(function(){ row[k].className="win"; beep("tap"); },k*220); })(i);
  },220);
  if(cleared) beep("win");

  $("#c-head").textContent = stage==="fix" ? "복습 끝!" :
    got===3 ? "완벽해!" : got===2 ? "훌륭해!" : got===1 ? "통과!" : "아깝다!";
  $("#c-score").textContent = P.score;
  $("#c-sum").textContent = n+"문제 중 "+right+"개 정답" +
    (stage!=="fix" && got===0 ? " · 8개부터 통과" : "");

  var box=$("#c-miss"); box.innerHTML=""; var seen={};
  P.miss.forEach(function(m){
    var k=fkey(m.a,m.b); if(seen[k]) return; seen[k]=1;
    var d=document.createElement("span"); d.className="n";
    d.textContent=m.a+" × "+m.b+" = "+m.v; box.appendChild(d);
  });

  var nx=$("#c-next");
  if(typeof stage==="number" && got>0 && stage<9){
    nx.textContent=(stage+1)+"단으로"; nx.style.display="";
    nx.onclick=function(){ startStage(stage+1); };
  }else if(stage===9 && got>0){
    nx.textContent="무지에게 도전"; nx.style.display="";
    nx.onclick=function(){ startStage("all"); };
  }else{
    nx.style.display="none";
  }
  $("#c-retry").onclick=function(){ startStage(stage); };
  show("s-clear");
}

$("#syncnow").onclick=function(){
  if(!cloudOn()){ alert("먼저 이어하기 코드를 넣어 주세요."); return; }
  syncAll().then(function(ok){ if(!ok) alert("연결에 실패했어요. 잠시 뒤 다시 눌러 보세요."); });
};
$("#wipe").onclick=function(){
  if(!confirm("모든 기록을 지울까요?")) return;
  G.stars={}; G.best={}; G.open=2; G.stats={}; persist(); paintSet(); paintMap();
};

/* ---------------- 연결 ---------------- */
$("#to-set").onclick=function(){ show("s-set"); };
$("#set-back").onclick=function(){ show("s-map"); };
$("#quit").onclick=function(){ P=null; show("s-map"); };
$("#c-map").onclick=function(){ show("s-map"); };

paintMap();
if(cloudOn()) cloudPull().then(function(ok){ if(ok) paintMap(); });
})();
</script>
